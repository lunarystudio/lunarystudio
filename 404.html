<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Nothing here — Lunary Studio</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0F0E0C;--bone:#E9E3D6;--ash:#8B8478;--ash-dim:#5E594F;--celadon:#B4C3AC;--line:rgba(233,227,214,.15)}
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--ink); color:var(--bone);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; font-weight:300;
    display:grid; place-items:center; padding:32px 24px;
  }
  .mono{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase}
  .wrap{max-width:560px; width:100%}
  .mark{width:74px; height:74px; margin-bottom:34px}
  .lbl{display:flex; align-items:center; gap:12px; color:var(--celadon); margin-bottom:22px}
  .lbl i{display:block; width:28px; height:1px; background:var(--celadon); opacity:.8}
  h1{
    font-family:"Bricolage Grotesque",sans-serif; font-weight:700;
    font-size:clamp(2.1rem,7vw,3.4rem); line-height:.95; letter-spacing:-.035em; margin:0 0 18px;
  }
  p{color:#CFC9BC; font-size:1rem; line-height:1.65; margin:0 0 34px; max-width:40ch}
  .acts{display:flex; flex-wrap:wrap; gap:12px}
  a.btn{
    display:inline-flex; align-items:center; gap:10px; padding:14px 22px;
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    border:1px solid var(--bone); background:var(--bone); color:var(--ink); text-decoration:none;
    transition:background .3s, color .3s, border-color .3s;
  }
  a.btn:hover{background:var(--celadon); border-color:var(--celadon)}
  a.ghost{background:transparent; color:var(--bone); border-color:var(--line)}
  a.ghost:hover{background:transparent; color:var(--celadon); border-color:var(--celadon)}
  .foot{margin-top:44px; padding-top:22px; border-top:1px solid var(--line); color:var(--ash-dim)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(233,227,214,.16)" />
      <g transform="translate(32 32)">
        <circle r="19" fill="#B4C3AC"/>
        <circle r="19" fill="#0F0E0C" transform="translate(8.5 -2.8)"/>
      </g>
    </svg>
    <div class="lbl mono"><i></i>Error 404</div>
    <h1>Nothing here.</h1>
    <p>The page you were after doesn't exist — or it was one of one, and it's gone. Everything that's still around is on the main page.</p>
    <div class="acts">
      <a class="btn" href="/">Back to the studio <span aria-hidden="true">→</span></a>
      <a class="btn ghost" href="/#gallery">See the gallery</a>
    </div>
    <div class="foot mono">Lunary Studio · Long Beach</div>
  </div>
</body>
</html>
